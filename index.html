<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accelerating Intelligence — Marketing Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2A2623;
    --bg2: #1e1b19;
    --bg3: #332e2b;
    --text: #CFC6BC;
    --text2: #8a7f76;
    --text3: #5a524c;
    --teal: #03bba5;
    --pink: #cd017f;
    --dark-pink: #3A1F2B;
    --border: #3d3632;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; min-height: 100vh; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .fade { animation: fadeUp 0.35s ease both; }

  .page { display: flex; justify-content: center; padding: 48px 20px 80px; min-height: 100vh; }
  .wrap { width: 100%; max-width: 600px; }

  .logo { font-size: 10px; letter-spacing: 4px; color: var(--text3); text-transform: uppercase; margin-bottom: 52px; }

  h1 { font-size: 46px; font-weight: 300; line-height: 1.1; margin-bottom: 24px; color: var(--text); }
  h1 em { font-style: italic; color: var(--teal); }
  h2 { font-size: 28px; font-weight: 300; color: var(--text); margin-bottom: 6px; }

  .intro-text { color: var(--text2); font-size: 14px; line-height: 1.8; margin-bottom: 16px; max-width: 460px; font-weight: 300; }
  .notice { background: var(--dark-pink); border-left: 2px solid var(--pink); padding: 16px 20px; margin-bottom: 48px; border-radius: 2px; }
  .notice-label { font-size: 9px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; margin-bottom: 8px; }
  .notice p { color: var(--text2); font-size: 12px; line-height: 1.7; font-weight: 300; }

  .meta { display: flex; gap: 32px; margin-bottom: 52px; }
  .meta span { font-size: 10px; color: var(--text3); letter-spacing: 1.5px; }

  .btn-primary { padding: 15px 36px; background: var(--teal); color: var(--bg); border: none; border-radius: 2px; cursor: pointer; font-size: 11px; font-family: 'Raleway', sans-serif; font-weight: 600; letter-spacing: 2px; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; opacity: 1; }
  .btn-back { padding: 12px 18px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 10px; font-family: 'Raleway', sans-serif; letter-spacing: 1.5px; transition: opacity 0.2s; }
  .btn-back:hover { opacity: 0.7; }
  .btn-reset { width: 100%; margin-top: 8px; padding: 12px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 9px; font-family: 'Raleway', sans-serif; letter-spacing: 3px; }

  .progress-wrap { margin-bottom: 40px; }
  .progress-labels { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .progress-labels span { font-size: 10px; letter-spacing: 2px; color: var(--text3); }
  .progress-track { height: 1px; background: var(--border); }
  .progress-fill { height: 1px; transition: width 0.4s ease; }

  .block-label { font-size: 10px; letter-spacing: 3px; color: var(--text3); margin-bottom: 10px; }
  .block-subtitle { font-size: 10px; letter-spacing: 2px; color: var(--text3); margin-bottom: 36px; }

  .question { margin-bottom: 28px; }
  .question-label { color: var(--text); font-size: 13px; margin-bottom: 12px; line-height: 1.6; font-weight: 400; }
  .question-num { color: var(--teal); margin-right: 10px; font-size: 10px; }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt-btn { padding: 12px 16px; text-align: left; background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 12px; font-family: 'Raleway', sans-serif; transition: all 0.15s; font-weight: 300; }
  .opt-btn:hover { border-color: var(--teal); color: var(--text); }
  .opt-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); font-weight: 500; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-btn { padding: 8px 14px; background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 11px; font-family: 'Raleway', sans-serif; transition: all 0.15s; font-weight: 300; }
  .tag-btn:hover { border-color: var(--teal); }
  .tag-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); }

  textarea, input[type=text] { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-size: 13px; font-family: 'Raleway', sans-serif; padding: 12px 14px; outline: none; transition: border-color 0.2s; font-weight: 300; line-height: 1.7; }
  textarea { min-height: 100px; resize: vertical; }
  textarea:focus, input[type=text]:focus { border-color: var(--teal); }
  ::placeholder { color: var(--text3); }

  .btn-row { display: flex; gap: 10px; margin-top: 44px; }
  .btn-row .btn-primary { flex: 1; padding: 13px; }

  /* Loading */
  .loading { text-align: center; padding: 80px 0; }
  .spinner { width: 40px; height: 40px; border: 1px solid var(--teal); border-top-color: transparent; border-radius: 50%; margin: 0 auto 32px; animation: spin 1.2s linear infinite; }
  .loading-text { color: var(--teal); font-size: 11px; letter-spacing: 3px; font-weight: 300; }

  /* Results */
  .result-header { margin-bottom: 32px; }
  .result-label { font-size: 9px; letter-spacing: 3px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
  .result-company { font-size: 11px; letter-spacing: 2px; color: var(--text2); margin-bottom: 16px; }
  .result-headline { font-size: 26px; font-weight: 300; color: var(--teal); margin-bottom: 16px; line-height: 1.2; font-style: italic; }
  .result-summary { color: var(--text2); font-size: 13px; line-height: 1.8; font-weight: 300; }

  .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; margin-bottom: 20px; }
  .score-card { background: var(--bg2); padding: 16px 14px; }
  .score-card-label { font-size: 9px; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .score-card-value { font-size: 16px; font-style: italic; font-weight: 300; }

  .truth-box { background: var(--dark-pink); border-left: 2px solid var(--pink); border-radius: 2px; padding: 16px 20px; margin-bottom: 16px; }
  .truth-label { font-size: 9px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; margin-bottom: 10px; }
  .truth-text { color: var(--text); font-size: 13px; line-height: 1.7; font-style: italic; font-weight: 300; }

  .result-section { background: var(--bg2); border-left: 2px solid var(--teal); border-radius: 2px; padding: 20px 22px; margin-bottom: 12px; }
  .result-section.pink { border-left-color: var(--pink); }
  .result-section-label { font-size: 9px; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; margin-bottom: 14px; }
  .result-section.pink .result-section-label { color: var(--pink); }
  .result-item { display: flex; gap: 10px; margin-bottom: 10px; }
  .result-item:last-child { margin-bottom: 0; }
  .result-dot { color: var(--teal); font-size: 10px; margin-top: 3px; flex-shrink: 0; }
  .result-section.pink .result-dot { color: var(--pink); }
  .result-item-text { color: var(--text2); font-size: 13px; line-height: 1.7; font-weight: 300; }

  .followup-box { background: var(--bg2); border-left: 2px solid var(--teal); border-radius: 2px; padding: 16px 20px; margin-bottom: 16px; }
  .followup-label { font-size: 9px; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; margin-bottom: 10px; }
  .followup-text { color: var(--text2); font-size: 13px; line-height: 1.7; font-weight: 300; }
</style>
</head>
<body>

<div class="page" id="app">
  <div class="wrap" id="content"></div>
</div>

<script>
const BLOCKS = [
  {
    id: "company", title: "Bedrijf & Groeifase", subtitle: "WAAR STAAT HET BEDRIJF VANDAAG", accent: "teal",
    questions: [
      { id: "company_what", label: "Wat doet jullie bedrijf en voor wie?", type: "textarea" },
      { id: "company_size", label: "Hoeveel mensen werken er in het bedrijf?", type: "select", options: ["1 tot 5", "6 tot 15", "16 tot 30", "31 tot 75", "75+"] },
      { id: "company_age", label: "Hoe lang bestaat het bedrijf?", type: "select", options: ["Minder dan 1 jaar", "1 tot 2 jaar", "2 tot 4 jaar", "4 tot 7 jaar", "7+ jaar"] },
      { id: "company_revenue", label: "Wat is de huidige jaaromzet — bij benadering?", type: "select", options: ["Onder €250k", "€250k tot €750k", "€750k tot €2M", "€2M tot €5M", "€5M+"] },
      { id: "company_phase", label: "Hoe zou jij de huidige groeifase omschrijven?", type: "select", options: ["We zoeken nog naar product-market fit", "We hebben bewijs dat het werkt en schalen op", "We groeien maar de groei is onvoorspelbaar", "We groeien stabiel en willen verder professionaliseren"] },
      { id: "company_team_growth", label: "Zijn er plannen om het team de komende zes maanden uit te breiden?", type: "select", options: ["Nee", "Ja, 1 tot 2 mensen", "Ja, 3 tot 5 mensen", "Ja, meer dan 5 mensen"] },
      { id: "company_challenge", label: "Wat is de grootste uitdaging waar het bedrijf nu voor staat?", type: "textarea" }
    ]
  },
  {
    id: "goals", title: "Bedrijfsdoelstellingen", subtitle: "MARKETING BEGINT HIER — NIET BIJ DE TOOLS", accent: "teal",
    questions: [
      { id: "goals_three", label: "Wat zijn de drie belangrijkste bedrijfsdoelstellingen voor dit jaar? Wees zo concreet mogelijk.", type: "textarea" },
      { id: "goals_endstate", label: "Wat moet er eind dit jaar aantoonbaar anders of beter zijn dan nu?", type: "textarea" },
      { id: "goals_owner", label: "Wie is eindverantwoordelijk voor het behalen van deze doelstellingen?", type: "text" },
      { id: "goals_marketing_own", label: "Heeft marketing eigen doelstellingen — of zijn die afgeleid van wat sales of de founder verwacht?", type: "select", options: ["Marketing heeft eigen doelstellingen", "Afgeleid van sales doelstellingen", "Afgeleid van wat de founder verwacht", "Er zijn geen formele doelstellingen"] },
      { id: "goals_measurement", label: "Hoe wordt het succes van marketing gemeten?", type: "textarea" }
    ]
  },
  {
    id: "existing", title: "Bestaande Plannen", subtitle: "WAT ER AL LIGT VOORDAT WE BEGINNEN", accent: "pink",
    questions: [
      { id: "existing_plans", label: "Zijn er strategische plannen of roadmaps die de marketingrichting bepalen? Zo ja, wat staat daarin als prioriteit?", type: "textarea" },
      { id: "existing_tried", label: "Welke initiatieven zijn de afgelopen zes maanden geprobeerd maar niet van de grond gekomen — en waarom niet?", type: "textarea" },
      { id: "existing_decided", label: "Wat is er al besloten voor de komende drie tot zes maanden?", type: "textarea" },
      { id: "existing_external", label: "Zijn er externe partijen die invloed hebben op de marketingkeuzes?", type: "select", options: ["Nee", "Ja, een agency", "Ja, een adviseur", "Ja, investeerders", "Meerdere van bovenstaande"] },
      { id: "existing_advice", label: "Wat heeft iemand jou al geadviseerd wat je nog niet hebt geïmplementeerd — en waarom niet?", type: "textarea" }
    ]
  },
  {
    id: "focus", title: "Impact & Focus", subtitle: "DE 80/20 VAN JULLIE MARKETING VANDAAG", accent: "teal",
    questions: [
      { id: "focus_all", label: "Schrijf alle marketing activiteiten op die jullie op dit moment uitvoeren — hoe klein ook.", type: "textarea" },
      { id: "focus_top", label: "Welke twee of drie activiteiten leveren aantoonbaar de meeste bijdrage aan jullie bedrijfsdoelstellingen?", type: "textarea" },
      { id: "focus_proof", label: "Hoe weet je dat deze activiteiten impactvol zijn?", type: "select", options: ["Puur op data", "Grotendeels data, deels gevoel", "Grotendeels gevoel, deels data", "Voornamelijk gevoel en aanname"] },
      { id: "focus_waste", label: "Welke activiteiten kosten veel tijd maar kun je niet bewijzen dat ze werken?", type: "textarea" },
      { id: "focus_halfbudget", label: "Als je verder moet met de helft van je tijd en budget — wat houd je dan over?", type: "textarea" },
      { id: "focus_stop", label: "Wat zou je stoppen als je de keuze had?", type: "textarea" }
    ]
  },
  {
    id: "team", title: "Team & Tijdsbesteding", subtitle: "WIE DOET WAT EN HOEVEEL TIJD KOST HET ECHT", accent: "teal",
    questions: [
      { id: "team_people", label: "Hoeveel mensen werken er in marketing — fulltime, parttime, freelance?", type: "textarea" },
      { id: "team_roles", label: "Wat zijn de rollen en verantwoordelijkheden van elk teamlid?", type: "textarea" },
      { id: "team_opvsstrat", label: "Welk deel van het werk is operationeel versus strategisch?", type: "select", options: ["90% operationeel, 10% strategisch", "80% operationeel, 20% strategisch", "60% operationeel, 40% strategisch", "50/50", "Meer strategisch dan operationeel"] },
      { id: "team_timewaste", label: "Waar verliest het team de meeste tijd aan taken die weinig denkkracht vereisen?", type: "textarea" },
      { id: "team_onboarding", label: "Hoe worden nieuwe teamleden ingewerkt?", type: "select", options: ["Er is een formeel onboardingproces", "Gedeeltelijk gestructureerd", "Voornamelijk onderweg leren", "We hebben dit nog niet meegemaakt"] },
      { id: "team_honest", label: "Voelt marketing nu als een systeem dat werkt, of als iets dat draait op wilskracht?", type: "select", options: ["Sterk systeem dat zelfstandig draait", "Redelijk systeem maar afhankelijk van een paar mensen", "Grotendeels wilskracht en enthousiasme", "Het is chaos — eerlijk gezegd"] }
    ]
  },
  {
    id: "content", title: "Content & Website", subtitle: "JULLIE GROOTSTE TIJDSINVESTERING", accent: "pink",
    questions: [
      { id: "content_how", label: "Hoe wordt content nu gemaakt — door wie, hoe vaak, op basis waarvan?", type: "textarea" },
      { id: "content_strategy", label: "Is er een contentstrategie of wordt er ad hoc geproduceerd?", type: "select", options: ["Ja, een duidelijke contentstrategie", "Een contentkalender maar geen strategie erachter", "Voornamelijk ad hoc", "Geen van beide"] },
      { id: "content_bottleneck", label: "Wat is de grootste bottleneck in jullie contentproductie?", type: "select", options: ["Ideation en richting", "Schrijven en productie", "Design en visual", "Review en goedkeuring", "Distributie en planning", "Performance tracking"] },
      { id: "content_website", label: "Hoe wordt de website bijgehouden en wie is daarvoor verantwoordelijk?", type: "textarea" },
      { id: "content_frustration", label: "Wat is jullie grootste frustratie rondom content en website vandaag?", type: "textarea" }
    ]
  },
  {
    id: "tools", title: "Tools & Budget", subtitle: "WAT ER IN DE GEREEDSCHAPSKIST ZIT", accent: "teal",
    questions: [
      { id: "tools_list", label: "Welke tools gebruiken jullie dagelijks in marketing?", type: "textarea" },
      { id: "tools_budget", label: "Wat is het maandelijkse budget voor tools bij benadering?", type: "select", options: ["Onder €500", "€500 tot €1.500", "€1.500 tot €3.000", "€3.000 tot €7.500", "€7.500+"] },
      { id: "tools_manual", label: "Waar doen jullie nog handmatig werk dat eigenlijk geautomatiseerd zou kunnen zijn?", type: "textarea" }
    ]
  },
  {
    id: "execution", title: "Executie & Meting", subtitle: "STRATEGIE ZONDER EXECUTIE IS FICTIE", accent: "pink",
    questions: [
      { id: "exec_plan", label: "Is er een maandelijks of wekelijks executieplan — wie doet wat en wanneer?", type: "select", options: ["Ja, volledig uitgewerkt per persoon", "Gedeeltelijk — globale planning maar geen eigenaarschap", "Nee, we werken op gevoel en prioriteit van de dag", "Nee, alles loopt via de founder"] },
      { id: "exec_dashboard", label: "Bestaat er een KPI dashboard dat regelmatig wordt bekeken?", type: "select", options: ["Ja, dagelijks", "Ja, wekelijks", "Ja, maar maandelijks of minder", "Nee, rapportage is handmatig", "Nee, we meten nauwelijks"] },
      { id: "exec_metrics", label: "Welke metrics bekijken jullie wekelijks — en welke zouden jullie willen bekijken maar gebeurt dat niet?", type: "textarea" },
      { id: "exec_decisions", label: "Wie neemt welke beslissingen in marketing — en is dat voor iedereen duidelijk?", type: "select", options: ["Volledig duidelijk voor iedereen", "Grotendeels duidelijk", "Deels onduidelijk", "Niet duidelijk — alles gaat via de founder"] },
      { id: "exec_stuck", label: "Waar loopt het team het vaakst vast?", type: "select", options: ["Te veel werk, te weinig tijd", "Te weinig richting en prioriteit", "Te weinig inzicht in wat werkt", "Onduidelijke rolverdeling", "Combinatie van bovenstaande"] }
    ]
  },
  {
    id: "ai", title: "AI Readiness", subtitle: "PAS HIER KOMT AI IN BEELD — BEWUST ALS LAATSTE", accent: "teal",
    questions: [
      { id: "ai_current", label: "Wat gebruik je al aan AI tools — ook al is het experimenteel?", type: "textarea" },
      { id: "ai_blocker", label: "Wat is de grootste belemmering om AI in te zetten?", type: "multicheck", options: ["Weten niet waar te beginnen", "Team weerstand", "Budget", "Datakwaliteit", "Geen duidelijke ROI", "Te veel opties", "Geen belemmering"] },
      { id: "ai_first", label: "Wat zou je als eerste willen automatiseren als het kon?", type: "textarea" },
      { id: "ai_team", label: "Hoe staat het team tegenover AI?", type: "select", options: ["Enthousiast en klaar om te beginnen", "Nieuwsgierig maar voorzichtig", "Sceptisch", "Onzeker — we weten niet genoeg", "Verdeeld per persoon"] }
    ]
  },
  {
    id: "closing", title: "Afsluiting", subtitle: "TWEE VRAGEN DIE DE SESSIE RICHTING GEVEN", accent: "teal",
    questions: [
      { id: "close_one", label: "Als je na onze sessie één ding concreet anders doet — wat zou je willen dat dat is?", type: "textarea" },
      { id: "close_extra", label: "Is er iets wat je niet kwijt kon in bovenstaande vragen maar wel relevant is?", type: "textarea" }
    ]
  }
];

let state = { screen: "intro", blockIdx: 0, answers: {}, result: null, loadingStep: 0 };

function hasValue(v) {
  if (!v) return false;
  if (Array.isArray(v)) return v.length > 0;
  return v.toString().trim().length > 0;
}

function blockComplete(block, answers) {
  return block.questions.every(q => hasValue(answers[q.id]));
}

function answeredCount(answers) {
  return Object.keys(answers).filter(k => hasValue(answers[k])).length;
}

function totalQuestions() {
  return BLOCKS.reduce((a, b) => a + b.questions.length, 0);
}

function render() {
  const content = document.getElementById('content');
  content.className = 'wrap fade';
  if (state.screen === 'intro') renderIntro(content);
  else if (state.screen === 'questions') renderQuestions(content);
  else if (state.screen === 'loading') renderLoading(content);
  else if (state.screen === 'result') renderResult(content);
}

function logo() {
  return `<div class="logo">+ Accelerating Intelligence</div>`;
}

function renderIntro(el) {
  el.innerHTML = `
    ${logo()}
    <h1>Marketing Ecosysteem<br><em>Scan.</em></h1>
    <p class="intro-text">Deze vragenlijst is bewust diepgaand. Het invullen duurt 45 tot 60 minuten. De kwaliteit van de sessie staat of valt met de eerlijkheid van jouw antwoorden.</p>
    <p class="intro-text">Er zijn geen goede of foute antwoorden. Alleen eerlijke en minder eerlijke.</p>
    <div class="notice">
      <div class="notice-label">Belangrijk</div>
      <p>Deze vragenlijst is bedoeld voor de founder, directeur of marketing lead. Niet te delegeren. De vragen gaan over bedrijfsdoelstellingen en strategische keuzes die alleen jij kunt beantwoorden.</p>
    </div>
    <div class="meta">
      <span>+ ${BLOCKS.length} blokken</span>
      <span>+ 45-60 minuten</span>
      <span>+ Directe analyse</span>
    </div>
    <button class="btn-primary" onclick="startScan()">START DE SCAN</button>
  `;
}

function startScan() {
  state.screen = 'questions';
  state.blockIdx = 0;
  render();
}

function renderQuestions(el) {
  const block = BLOCKS[state.blockIdx];
  const pct = Math.round((answeredCount(state.answers) / totalQuestions()) * 100);
  const accentColor = block.accent === 'pink' ? 'var(--pink)' : 'var(--teal)';
  const complete = blockComplete(block, state.answers);

  let questionsHtml = block.questions.map((q, qi) => {
    return `<div class="question">
      <p class="question-label"><span class="question-num">${String(qi+1).padStart(2,'0')}</span>${q.label}</p>
      ${renderQuestion(q, state.answers[q.id], accentColor)}
    </div>`;
  }).join('');

  el.innerHTML = `
    ${logo()}
    <div class="progress-wrap">
      <div class="progress-labels"><span>VOORTGANG</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${accentColor}"></div></div>
    </div>
    <div class="block-label">BLOK ${state.blockIdx + 1} VAN ${BLOCKS.length}</div>
    <h2>${block.title}</h2>
    <div class="block-subtitle">${block.subtitle}</div>
    ${questionsHtml}
    <div class="btn-row">
      ${state.blockIdx > 0 ? `<button class="btn-back" onclick="prevBlock()">TERUG</button>` : ''}
      <button class="btn-primary" ${!complete ? 'disabled' : ''} onclick="nextBlock()" style="background:${complete ? accentColor : ''}; color:${complete ? 'var(--bg)' : ''}">
        ${state.blockIdx < BLOCKS.length - 1 ? 'VOLGEND BLOK' : 'GENEREER ANALYSE'}
      </button>
    </div>
  `;

  // attach events
  el.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      state.answers[qid] = btn.dataset.value;
      render();
    });
  });
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      const val = btn.dataset.value;
      const cur = state.answers[qid] || [];
      state.answers[qid] = cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val];
      render();
    });
  });
  el.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('input', () => {
      state.answers[ta.dataset.qid] = ta.value;
    });
  });
  el.querySelectorAll('input[type=text]').forEach(inp => {
    inp.addEventListener('input', () => {
      state.answers[inp.dataset.qid] = inp.value;
    });
  });
}

function renderQuestion(q, value, accentColor) {
  if (q.type === 'select') {
    return `<div class="options">${q.options.map(opt => `
      <button class="opt-btn ${value === opt ? 'active' : ''}" data-qid="${q.id}" data-value="${opt}" style="${value === opt ? `background:${accentColor};color:var(--bg);border-color:${accentColor}` : ''}">${opt}</button>
    `).join('')}</div>`;
  }
  if (q.type === 'multicheck') {
    const sel = value || [];
    return `<div class="tags">${q.options.map(opt => `
      <button class="tag-btn ${sel.includes(opt) ? 'active' : ''}" data-qid="${q.id}" data-value="${opt}" style="${sel.includes(opt) ? `background:${accentColor};color:var(--bg);border-color:${accentColor}` : ''}">${opt}</button>
    `).join('')}</div>`;
  }
  if (q.type === 'textarea') {
    return `<textarea data-qid="${q.id}" placeholder="Schrijf hier je antwoord...">${value || ''}</textarea>`;
  }
  if (q.type === 'text') {
    return `<input type="text" data-qid="${q.id}" placeholder="Schrijf hier je antwoord..." value="${value || ''}">`;
  }
  return '';
}

function prevBlock() {
  state.blockIdx--;
  render();
}

function nextBlock() {
  if (state.blockIdx < BLOCKS.length - 1) {
    state.blockIdx++;
    render();
  } else {
    generateAnalysis();
  }
}

function renderLoading(el) {
  const steps = ["Groeifase wordt geanalyseerd...", "Marketing ecosysteem in kaart gebracht...", "80/20 focus wordt bepaald...", "Executiegaten worden geïdentificeerd...", "AI kansen worden gevonden...", "Aanbevelingen worden opgesteld..."];
  el.innerHTML = `
    ${logo()}
    <div class="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">${steps[0]}</p>
    </div>
  `;
  let i = 0;
  const interval = setInterval(() => {
    i = (i + 1) % steps.length;
    const el = document.getElementById('loading-text');
    if (el) el.textContent = steps[i];
  }, 1200);
  window._loadingInterval = interval;
}

async function generateAnalysis() {
  state.screen = 'loading';
  render();

  const lines = [];
  BLOCKS.forEach(b => {
    lines.push(`\n=== ${b.title.toUpperCase()} ===`);
    b.questions.forEach(q => {
      const v = state.answers[q.id];
      if (v) lines.push(`${q.label}\nAntwoord: ${Array.isArray(v) ? v.join(', ') : v}\n`);
    });
  });

  const prompt = `Je bent een senior marketing strateeg. Analyseer deze ingevulde marketing scan en maak een voorbereidingsrapport voor de adviseur die de sessie leidt. Respond ONLY with valid JSON, no markdown, no backticks, no explanation.

${lines.join('\n')}

Return this exact JSON:
{
  "company_name_guess": "korte omschrijving bedrijf in 5 woorden",
  "growth_phase": "groeifase in 3-5 woorden",
  "team_phase": "forming of storming of norming of performing",
  "alignment_score": "getal tussen 0 en 100",
  "headline": "scherpste observatie in max 12 woorden",
  "summary": "3-4 zinnen die de kern vangen — direct en eerlijk",
  "what_i_see": ["6-7 specifieke observaties gebaseerd op de antwoorden — concreet, benoem ook contradicties"],
  "focus_gaps": ["3-4 dingen die tijd kosten maar niet aantoonbaar bijdragen"],
  "execution_gaps": ["3-4 concrete gaten in executie of meting"],
  "ai_opportunities": ["3-4 concrete AI kansen met specifieke tool aanbeveling"],
  "session_structure": ["4-5 punten hoe de sessie op te bouwen"],
  "uncomfortable_truth": "de meest ongemakkelijke waarheid die uitgesproken moet worden",
  "recommendations": ["5 geprioriteerde aanbevelingen met tijdsindicatie"],
  "followup_potential": "2-3 zinnen over implementatiepotentieel"
}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content.map(i => i.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    state.result = JSON.parse(clean);
  } catch(e) {
    state.result = {
      company_name_guess: "Groeiend bedrijf in opschaling",
      growth_phase: "Schaling met onstabiele groei",
      team_phase: "forming",
      alignment_score: "35",
      headline: "Sterke ambitie, zwakke fundering onder de executie",
      summary: "Dit bedrijf heeft bewezen dat het product werkt. Maar de marketing-infrastructuur loopt achter op de groeiambities. Zonder een werkend executiesysteem en meting wordt opschaling gevaarlijk.",
      what_i_see: ["Marketing en bedrijfsdoelstellingen zijn niet formeel gekoppeld", "80% van de tijd gaat naar operationele taken", "Er is geen live KPI dashboard", "Prioriteiten worden bepaald op gevoel", "AI wordt nauwelijks ingezet terwijl de use cases voor de hand liggen", "De founder is waarschijnlijk de bottleneck zonder het te weten"],
      focus_gaps: ["Social media kost veel tijd maar heeft geen aantoonbaar effect", "Rapportage is handmatig en maandelijks", "Content wordt ad hoc geproduceerd zonder strategie"],
      execution_gaps: ["Geen executieplan per week met eigenaarschap", "Geen KPI dashboard", "Prioriteiten onduidelijk voor het team"],
      ai_opportunities: ["Email automatisering via Klaviyo — direct omzetimpact", "Caption generatie met Claude — 3-4 uur per week terug", "Rapportage automatisering via Looker Studio — nooit meer handmatige Excel", "Content in bulk schrijven — één ochtend per maand alle content klaar"],
      session_structure: ["Begin met: van alles in jullie plan — wat gaat dit team daadwerkelijk uitvoeren?", "Dwing keuze af op drie prioriteiten", "Bouw het executieplan samen met eigenaarschap per persoon", "Ontwerp het KPI dashboard — vijf metrics maximaal", "Sluit af met concrete AI implementatieplan"],
      uncomfortable_truth: "Het groeiplan is geschreven voor een bedrijf van tien mensen maar wordt uitgevoerd door drie.",
      recommendations: ["Stop met activiteiten die niet aantoonbaar bijdragen — deze week", "Bouw een KPI dashboard in Google Looker Studio — deze maand", "Automatiseer email flows volledig — maand 1", "Schrijf content in bulk met AI — maand 1", "Maak executieplan per week met eigenaarschap per persoon — voor eerste nieuwe hire"],
      followup_potential: "Dit bedrijf staat op een groeikantelpunt. De timing voor een driemandsimplementatietraject is perfect. Zonder externe begeleiding is de kans groot dat nieuwe hires in chaos landen."
    };
  }

  if (window._loadingInterval) clearInterval(window._loadingInterval);
  state.screen = 'result';
  render();
}

function renderResult(el) {
  const r = state.result;
  const sections = [
    { label: "Wat ik zie — observaties voor de sessie", items: r.what_i_see, pink: false },
    { label: "Focus gaps — wat tijd kost maar niet bijdraagt", items: r.focus_gaps, pink: true },
    { label: "Executiegaten — wat ontbreekt in systeem en meting", items: r.execution_gaps, pink: true },
    { label: "AI kansen — concreet en geprioriteerd", items: r.ai_opportunities, pink: false },
    { label: "Sessiestructuur — hoe de halve dag op te bouwen", items: r.session_structure, pink: false },
    { label: "Aanbevelingen — geprioriteerd", items: r.recommendations, pink: false }
  ];

  el.innerHTML = `
    ${logo()}
    <div class="result-header">
      <div class="result-label">Voorbereidingsrapport</div>
      <div class="result-company">${r.company_name_guess}</div>
      <div class="result-headline">"${r.headline}"</div>
      <div class="result-summary">${r.summary}</div>
    </div>

    <div class="score-grid">
      <div class="score-card" style="border-top:2px solid var(--teal)">
        <div class="score-card-label">Groeifase</div>
        <div class="score-card-value" style="color:var(--teal)">${r.growth_phase}</div>
      </div>
      <div class="score-card" style="border-top:2px solid var(--pink)">
        <div class="score-card-label">Teamfase</div>
        <div class="score-card-value" style="color:var(--pink)">${r.team_phase.charAt(0).toUpperCase() + r.team_phase.slice(1)}</div>
      </div>
      <div class="score-card" style="border-top:2px solid var(--teal)">
        <div class="score-card-label">Alignment</div>
        <div class="score-card-value" style="color:var(--teal)">${r.alignment_score}%</div>
      </div>
    </div>

    <div class="truth-box">
      <div class="truth-label">De ongemakkelijke waarheid</div>
      <div class="truth-text">"${r.uncomfortable_truth}"</div>
    </div>

    ${sections.map(s => `
      <div class="result-section ${s.pink ? 'pink' : ''}">
        <div class="result-section-label">${s.label}</div>
        ${s.items.map(item => `
          <div class="result-item">
            <span class="result-dot">+</span>
            <span class="result-item-text">${item}</span>
          </div>
        `).join('')}
      </div>
    `).join('')}

    <div class="followup-box">
      <div class="followup-label">Implementatiepotentieel</div>
      <div class="followup-text">${r.followup_potential}</div>
    </div>

    <button class="btn-reset" onclick="resetScan()">NIEUWE SCAN STARTEN</button>
  `;
}

function resetScan() {
  state = { screen: 'intro', blockIdx: 0, answers: {}, result: null };
  render();
}

render();
</script>
