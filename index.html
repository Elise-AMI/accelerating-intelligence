<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accelerating Intelligence — Marketing Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2A2623;
    --bg2: #1e1b19;
    --bg3: #332e2b;
    --text: #E8E0D8;
    --text2: #B8AFA6;
    --text3: #7a7068;
    --teal: #03bba5;
    --pink: #cd017f;
    --dark-pink: #3A1F2B;
    --border: #4a4440;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; min-height: 100vh; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .fade { animation: fadeUp 0.35s ease both; }

  .page { display: flex; justify-content: center; padding: 48px 20px 80px; min-height: 100vh; }
  .wrap { width: 100%; max-width: 600px; }

  .logo { font-size: 10px; letter-spacing: 4px; color: var(--text3); text-transform: uppercase; margin-bottom: 52px; }

  h1 { font-size: 46px; font-weight: 300; line-height: 1.1; margin-bottom: 24px; color: var(--text); }
  h1 em { font-style: italic; color: var(--teal); }
  h2 { font-size: 28px; font-weight: 300; color: var(--text); margin-bottom: 6px; }

  .intro-text { color: var(--text2); font-size: 14px; line-height: 1.8; margin-bottom: 16px; max-width: 460px; font-weight: 300; }
  .notice { background: var(--dark-pink); border-left: 2px solid var(--pink); padding: 16px 20px; margin-bottom: 48px; border-radius: 2px; }
  .notice-label { font-size: 9px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; margin-bottom: 8px; }
  .notice p { color: var(--text2); font-size: 12px; line-height: 1.7; font-weight: 300; }

  .meta { display: flex; gap: 32px; margin-bottom: 52px; }
  .meta span { font-size: 10px; color: var(--text3); letter-spacing: 1.5px; }

  .btn-primary { padding: 15px 36px; background: var(--teal); color: var(--bg); border: none; border-radius: 2px; cursor: pointer; font-size: 11px; font-family: 'Raleway', sans-serif; font-weight: 600; letter-spacing: 2px; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; opacity: 1; }
  .btn-back { padding: 12px 18px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 10px; font-family: 'Raleway', sans-serif; letter-spacing: 1.5px; transition: opacity 0.2s; }
  .btn-back:hover { opacity: 0.7; }
  .btn-reset { width: 100%; margin-top: 8px; padding: 12px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 9px; font-family: 'Raleway', sans-serif; letter-spacing: 3px; }

  .progress-wrap { margin-bottom: 40px; }
  .progress-labels { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .progress-labels span { font-size: 10px; letter-spacing: 2px; color: var(--text3); }
  .progress-track { height: 1px; background: var(--border); }
  .progress-fill { height: 1px; transition: width 0.4s ease; }

  .block-label { font-size: 10px; letter-spacing: 3px; color: var(--text3); margin-bottom: 10px; }
  .block-subtitle { font-size: 10px; letter-spacing: 2px; color: var(--text3); margin-bottom: 36px; }

  .question { margin-bottom: 28px; }
  .question-label { color: var(--text); font-size: 13px; margin-bottom: 12px; line-height: 1.6; font-weight: 400; }
  .question-num { color: var(--teal); margin-right: 10px; font-size: 10px; }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt-btn { padding: 12px 16px; text-align: left; background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; font-size: 12px; font-family: 'Raleway', sans-serif; transition: all 0.15s; font-weight: 300; }
  .opt-btn:hover { border-color: var(--teal); color: var(--text); }
  .opt-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); font-weight: 500; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-btn { padding: 8px 14px; background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 11px; font-family: 'Raleway', sans-serif; transition: all 0.15s; font-weight: 300; }
  .tag-btn:hover { border-color: var(--teal); }
  .tag-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); }

  textarea, input[type=text] { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-size: 13px; font-family: 'Raleway', sans-serif; padding: 12px 14px; outline: none; transition: border-color 0.2s; font-weight: 300; line-height: 1.7; }
  textarea { min-height: 100px; resize: vertical; }
  textarea:focus, input[type=text]:focus { border-color: var(--teal); }
  ::placeholder { color: var(--text3); }

  .btn-row { display: flex; gap: 10px; margin-top: 44px; }
  .btn-row .btn-primary { flex: 1; padding: 13px; }

  /* Loading */
  .loading { text-align: center; padding: 80px 0; }
  .spinner { width: 40px; height: 40px; border: 1px solid var(--teal); border-top-color: transparent; border-radius: 50%; margin: 0 auto 32px; animation: spin 1.2s linear infinite; }
  .loading-text { color: var(--teal); font-size: 11px; letter-spacing: 3px; font-weight: 300; }

  /* Results */
  .result-header { margin-bottom: 32px; }
  .result-label { font-size: 9px; letter-spacing: 3px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
  .result-company { font-size: 11px; letter-spacing: 2px; color: var(--text2); margin-bottom: 16px; }
  .result-headline { font-size: 26px; font-weight: 300; color: var(--teal); margin-bottom: 16px; line-height: 1.2; font-style: italic; }
  .result-summary { color: var(--text2); font-size: 13px; line-height: 1.8; font-weight: 300; }

  .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; margin-bottom: 20px; }
  .score-card { background: var(--bg2); padding: 16px 14px; }
  .score-card-label { font-size: 9px; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .score-card-value { font-size: 16px; font-style: italic; font-weight: 300; }

  .truth-box { background: var(--dark-pink); border-left: 2px solid var(--pink); border-radius: 2px; padding: 16px 20px; margin-bottom: 16px; }
  .truth-label { font-size: 9px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; margin-bottom: 10px; }
  .truth-text { color: var(--text); font-size: 13px; line-height: 1.7; font-style: italic; font-weight: 300; }

  .result-section { background: var(--bg2); border-left: 2px solid var(--teal); border-radius: 2px; padding: 20px 22px; margin-bottom: 12px; }
  .result-section.pink { border-left-color: var(--pink); }
  .result-section-label { font-size: 9px; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; margin-bottom: 14px; }
  .result-section.pink .result-section-label { color: var(--pink); }
  .result-item { display: flex; gap: 10px; margin-bottom: 10px; }
  .result-item:last-child { margin-bottom: 0; }
  .result-dot { color: var(--teal); font-size: 10px; margin-top: 3px; flex-shrink: 0; }
  .result-section.pink .result-dot { color: var(--pink); }
  .result-item-text { color: var(--text2); font-size: 13px; line-height: 1.7; font-weight: 300; }

  .followup-box { background: var(--bg2); border-left: 2px solid var(--teal); border-radius: 2px; padding: 16px 20px; margin-bottom: 16px; }
  .followup-label { font-size: 9px; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; margin-bottom: 10px; }
  .followup-text { color: var(--text2); font-size: 13px; line-height: 1.7; font-weight: 300; }

  .email-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 2px; padding: 24px; margin-top: 20px; }
  .email-label { font-size: 9px; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; margin-bottom: 10px; }
  .email-desc { color: var(--text2); font-size: 12px; line-height: 1.7; font-weight: 300; }
</style>
</head>
<body>

<div class="page" id="app">
  <div class="wrap" id="content"></div>
</div>

      { id: "team_roles", label: "Wat zijn de rollen en verantwoordelijkheden van elk teamlid?", type: "textarea" },
      { id: "team_opvsstrat", label: "Welk deel van het werk is operationeel versus strategisch?", type: "select", options: ["90% operationeel, 10% strategisch", "80% operationeel, 20% strategisch", "60% operationeel, 40% strategisch", "50/50", "Meer strategisch dan operationeel"] },

  },

let state = { screen: "intro", blockIdx: 0, answers: {}, result: null, loadingStep: 0 };

function hasValue(v) {
  if (!v) return false;
  if (Array.isArray(v)) return v.length > 0;
  return v.toString().trim().length > 0;
}

function blockComplete(block, answers) {
  return block.questions.every(q => {
    const el = document.querySelector(`[data-qid="${q.id}"]`);
    if (el && (el.tagName === 'TEXTAREA' || el.type === 'text')) {
      if (el.value && el.value.trim()) {
        answers[q.id] = el.value;
      }
    }
    return hasValue(answers[q.id]);
  });
}

function answeredCount(answers) {
  return Object.keys(answers).filter(k => hasValue(answers[k])).length;
}

function totalQuestions() {
  return BLOCKS.reduce((a, b) => a + b.questions.length, 0);
}

function render() {
  const content = document.getElementById('content');
  content.className = 'wrap fade';
  if (state.screen === 'intro') renderIntro(content);
  else if (state.screen === 'questions') renderQuestions(content);
  
  else if (state.screen === 'result') renderResult(content);
}

function logo() {
  return `<div class="logo">+ Accelerating Intelligence</div>`;
}

function renderIntro(el) {
  el.innerHTML = `
    ${logo()}
    <h1>Marketing Ecosysteem<br><em>Scan.</em></h1>

    <p class="intro-text">Er zijn geen goede of foute antwoorden.</p>
    <div class="notice">
      <div class="notice-label">Belangrijk</div>
      <p>Deze vragenlijst is bedoeld voor de founder, directeur of marketing lead. Niet te delegeren. De vragen gaan over bedrijfsdoelstellingen en strategische keuzes die alleen jij kunt beantwoorden.</p>
    </div>
    <div class="meta">
      <span>+ ${BLOCKS.length} blokken</span>
      <span>+ 45-60 minuten</span>
      
    </div>
    <button class="btn-primary" onclick="startScan()">START DE SCAN</button>
  `;
}

function startScan() {
  state.screen = 'questions';
  state.blockIdx = 0;
  render();
}

function renderQuestions(el) {
  const block = BLOCKS[state.blockIdx];
  const pct = Math.round((answeredCount(state.answers) / totalQuestions()) * 100);
  const accentColor = block.accent === 'pink' ? 'var(--pink)' : 'var(--teal)';
  const complete = blockComplete(block, state.answers);

  let questionsHtml = block.questions.map((q, qi) => {
    return `<div class="question">
      <p class="question-label"><span class="question-num">${String(qi+1).padStart(2,'0')}</span>${q.label}</p>
      ${renderQuestion(q, state.answers[q.id], accentColor)}
    </div>`;
  }).join('');

  el.innerHTML = `
    ${logo()}
    <div class="progress-wrap">
      <div class="progress-labels"><span>VOORTGANG</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${accentColor}"></div></div>
    </div>
    <div class="block-label">BLOK ${state.blockIdx + 1} VAN ${BLOCKS.length}</div>
    <h2>${block.title}</h2>
    <div class="block-subtitle">${block.subtitle}</div>
    ${questionsHtml}
    <div class="btn-row">
      ${state.blockIdx > 0 ? `<button class="btn-back" onclick="prevBlock()">TERUG</button>` : ''}
      <button class="btn-primary" ${!complete ? 'disabled' : ''} onclick="nextBlock()" style="background:${complete ? accentColor : ''}; color:${complete ? 'var(--bg)' : ''}">
        ${state.blockIdx < BLOCKS.length - 1 ? 'VOLGEND BLOK' : 'SCAN AFRONDEN'}
      </button>
    </div>
  `;

  // attach events
  el.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      state.answers[qid] = btn.dataset.value;
      render();
    });
  });
  el.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      const val = btn.dataset.value;
      const cur = state.answers[qid] || [];
      state.answers[qid] = cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val];
      render();
    });
  });
  el.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('input', () => {
      state.answers[ta.dataset.qid] = ta.value;
      const block = BLOCKS[state.blockIdx];
      const complete = blockComplete(block, state.answers);
      const btn = document.querySelector('.btn-row .btn-primary');
      if (btn) {
        btn.disabled = !complete;
        const accentColor = block.accent === 'pink' ? 'var(--pink)' : 'var(--teal)';
        btn.style.background = complete ? accentColor : 'var(--bg3)';
        btn.style.color = complete ? 'var(--bg)' : 'var(--text3)';
        btn.style.cursor = complete ? 'pointer' : 'not-allowed';
      }
    });
  });
  el.querySelectorAll('input[type=text]').forEach(inp => {
    inp.addEventListener('input', () => {
      state.answers[inp.dataset.qid] = inp.value;
      const block = BLOCKS[state.blockIdx];
      const complete = blockComplete(block, state.answers);
      const btn = document.querySelector('.btn-row .btn-primary');
      if (btn) {
        btn.disabled = !complete;
        const accentColor = block.accent === 'pink' ? 'var(--pink)' : 'var(--teal)';
        btn.style.background = complete ? accentColor : 'var(--bg3)';
        btn.style.color = complete ? 'var(--bg)' : 'var(--text3)';
        btn.style.cursor = complete ? 'pointer' : 'not-allowed';
      }
    });
  });
}

function renderQuestion(q, value, accentColor) {
  if (q.type === 'select') {
    return `<div class="options">${q.options.map(opt => `
      <button class="opt-btn ${value === opt ? 'active' : ''}" data-qid="${q.id}" data-value="${opt}" style="${value === opt ? `background:${accentColor};color:var(--bg);border-color:${accentColor}` : ''}">${opt}</button>
    `).join('')}</div>`;
  }
  if (q.type === 'multicheck') {
    const sel = value || [];
    return `<div class="tags">${q.options.map(opt => `
      <button class="tag-btn ${sel.includes(opt) ? 'active' : ''}" data-qid="${q.id}" data-value="${opt}" style="${sel.includes(opt) ? `background:${accentColor};color:var(--bg);border-color:${accentColor}` : ''}">${opt}</button>
    `).join('')}</div>`;
  }
  if (q.type === 'textarea') {
    return `<textarea data-qid="${q.id}" placeholder="Schrijf hier je antwoord...">${value || ''}</textarea>`;
  }
  if (q.type === 'text') {
    return `<input type="text" data-qid="${q.id}" placeholder="Schrijf hier je antwoord..." value="${value || ''}">`;
  }
  return '';
}

function prevBlock() {
  state.blockIdx--;
  render();
}

function nextBlock() {
  if (state.blockIdx < BLOCKS.length - 1) {
    state.blockIdx++;
    render();
  } else {
    generateAnalysis();
  }
}



function generateAnalysis() {
  state.screen = 'result';
  render();
}`;

  try {
    state.screen = 'result';
  render();
}

function renderResult(el) {
  el.innerHTML = `
    ${logo()}
    <div style="margin-bottom:48px;">
      <div style="font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:16px;">Scan Compleet</div>
      <h2 style="font-family:Raleway,sans-serif;font-size:28px;font-weight:300;color:var(--text);margin-bottom:16px;">Bedankt voor het invullen.</h2>
      <p style="color:var(--text2);font-size:13px;line-height:1.8;font-weight:300;max-width:440px;">Download de scan als PDF en stuur hem naar je adviseur. Die neemt contact met je op om een sessie in te plannen.</p>
    </div>
    <button class="btn-primary" onclick="downloadPDF()" style="width:100%;padding:15px;font-size:11px;letter-spacing:2px;margin-bottom:10px;">
      DOWNLOAD SCAN ALS PDF
    </button>
    <button class="btn-reset" onclick="resetScan()">OPNIEUW BEGINNEN</button>
  `;
}

function downloadPDF() {
  document.title = "Accelerating Intelligence — Analyse";
  setTimeout(() => { window.print(); }, 100);
}

function resetScan() {
  state = { screen: 'intro', blockIdx: 0, answers: {}, result: null };
  render();
}

render();
</script>
